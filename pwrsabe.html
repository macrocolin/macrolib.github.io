<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>高变异药物RSABE样本量评估</title>
<style>
  :root {
    --color-primary: #206ea7;
    --color-primary-light: rgba(32,110,167,0.15);
    --color-book: #077b70;
    --color-chapter: #af4d0d;
    --color-page: #206ea7;
    --color-draft: #7e50b1;
    --color-bookshelf: #a94747;
    --color-positive: #0f7d15;
    --color-negative: #ab0f0e;
    --color-warning: #cf4d03;
    --color-info: #0288D1;
    --bg-body: #f5f5f5;
    --bg-card: #ffffff;
    --text-primary: #444;
    --text-muted: #777;
    --text-heading: #222;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Oxygen, Ubuntu, Roboto, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
    --radius-s: 3px;
    --radius-m: 4px;
    --radius-l: 8px;
    --shadow-card: 0 1px 6px -1px rgba(0,0,0,0.1);
    --shadow-sub: 0 1px 3px 0 rgba(0,0,0,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg-body);
    color: var(--text-primary);
    line-height: 1.6;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    padding: 20px;
  }
  .container {
    max-width: 1300px;
    margin: 0 auto;
    background: var(--bg-card);
    padding: 30px;
    border-radius: var(--radius-l);
    box-shadow: var(--shadow-card);
  }
  h1 {
    color: var(--text-heading);
    font-size: 1.8rem;
    font-weight: 600;
    margin-bottom: 8px;
  }
  h2 {
    color: var(--text-heading);
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h2::before {
    content: "";
    display: inline-block;
    width: 4px;
    height: 18px;
    background: var(--color-primary);
    border-radius: 2px;
  }

    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
  }
  .field {
    display: flex;
    flex-direction: column;
  }
  .field label {
    font-size: 0.85rem;
    color: var(--text-primary);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .field .hint {
    color: var(--text-muted);
    font-weight: 400;
    font-size: 0.8rem;
  }
  .field input, .field select {
    width: 100%;
    padding: 7px 12px;
    border: 1px solid #ddd;
    border-radius: var(--radius-m);
    font-size: 0.9rem;
    font-family: var(--font-body);
    color: var(--text-primary);
    background: #fff;
    transition: border-color ease-in-out 120ms, box-shadow ease-in-out 120ms;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 2px var(--color-primary-light);
  }
  .buttons {
    display: flex;
    gap: 10px;
    margin: 20px 0;
  }
  button {
    text-decoration: none;
    font-size: 0.85rem;
    line-height: 1.4em;
    padding: 7.8px 16px;
    margin: 6px 0;
    display: inline-block;
    font-weight: 400;
    outline: 0;
    border-radius: var(--radius-m);
    cursor: pointer;
    transition: background-color ease-in-out 120ms, filter ease-in-out 120ms, box-shadow ease-in-out 120ms;
    border: 1px solid transparent;
    vertical-align: top;
    font-family: var(--font-body);
  }
  button:hover {
    filter: brightness(1.1);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    filter: none;
  }
  .btn-primary {
    background: var(--color-primary);
    color: #fff;
    border-color: var(--color-primary);

  .btn-secondary {

    font-weight: 700;

  @media (max-width: 520px) {
    .results { grid-template-columns: 1fr; }

  }
</style>

<body>
<div class="container">
  <h1>高变异药物RSABE样本量评估</h1>

  <div class="section">
    <h2>计算类型</h2>
    <div class="grid">
      <div class="field">
        <label>计算目标 <span class="hint">(Calculate for)</span></label>
        <select id="type">
          <option value="power">统计功效 (Power)</option>
          <option value="sampleSize">样本量 (Sample Size)</option>
        </select>
      </div>
      <div class="field">
        <label>研究设计 <span class="hint">(Study Design)</span></label>
        <select id="design">
          <option value="2x3x3" selected>2x3x3 交叉设计</option>
          <option value="2x2x4">2x2x4 交叉设计</option>
          <option value="2x2x2">2x2x2 交叉设计</option>
          <option value="parallel">平行设计</option>
        </select>
      </div>
      <div class="field">
        <label>监管机构 <span class="hint">(Regulatory Agency)</span></label>
        <select id="agency">
          <option value="FDA">FDA (美国)</option>
          <option value="EMA">EMA (欧洲)</option>
        </select>
      </div>
      <div class="field">
        <label>模拟次数 <span class="hint">(Simulations)</span></label>
        <select id="nsim">
          <option value="1000">1,000</option>
          <option value="5000" selected>5,000</option>
          <option value="10000">10,000</option>
          <option value="50000">50,000</option>
        </select>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>假设参数</h2>
    <div class="grid">
      <div class="field">
        <label>参比制剂变异系数 <span class="hint">(CVwR)</span></label>
        <input type="number" id="cvwR" value="0.4" step="0.01">
      </div>
      <div class="field">
        <label>受试制剂变异系数 <span class="hint">(CVwT)</span></label>
        <input type="number" id="cvwT" value="0.4" step="0.01">
      </div>
      <div class="field">
        <label>预期几何均值比 <span class="hint">(Expected GMR)</span></label>
        <input type="number" id="gmr" value="0.9" step="0.01">
      </div>
      <div class="field">
        <label>单侧α <span class="hint">(One-sided Alpha)</span></label>
        <input type="number" id="alpha" value="0.05" step="0.01">
      </div>
      <div class="field" id="valueField">
        <label id="valueLabel">样本量 <span class="hint">(Sample Size)</span></label>
        <input type="number" id="value" value="24" step="2">
      </div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn-primary" onclick="calculate()">计算</button>
    <button class="btn-secondary" onclick="resetDefaults()">重置默认值</button>
  </div>

  <div class="results">
    <div class="result-card">
      <div class="label">标度后接受标准</div>
      <div class="value" id="scaledLimits_result">—</div>
      <div class="sub" id="scaledLimits_sub"></div>
    </div>
    <div class="result-card">
      <div class="label">统计功效</div>
      <div class="value" id="power_result">—</div>
    </div>
    <div class="result-card">
      <div class="label">样本量</div>
      <div class="value" id="sampleSize_result">—</div>
    </div>
    <div class="result-card">
      <div class="label">参比制剂标准差</div>
      <div class="value" id="sigmaW_result">—</div>
    </div>
    <div class="result-card summary">
      <div class="label">计算结果说明</div>
      <div class="summary-text" id="summary">—</div>
    </div>
  </div>

</div>

<script>
// 统计函数
function erf(x) {
  const sign = Math.sign(x);
  x = Math.abs(x);
  const a1 =  0.254829592;
  const a2 = -0.284496736;
  const a3 =  1.421413741;
  const a4 = -1.453152027;
  const a5 =  1.061405429;
  const p  =  0.3275911;
  const t = 1.0 / (1.0 + p * x);
  const y = 1.0 - (((((a5*t + a4)*t) + a3)*t + a2)*t + a1)*t * Math.exp(-x*x);
  return sign * y;
}

function normalCDF(x) {
  return 0.5 * (1.0 + erf(x / Math.SQRT2));
}

function normalQuantile(p) {
  if (p <= 0 || p >= 1) return NaN;
  if (p < 0.5) return -rationalApprox(Math.sqrt(-2 * Math.log(p)));
  else return rationalApprox(Math.sqrt(-2 * Math.log(1 - p)));
}

function rationalApprox(t) {
  const c = [2.515517, 0.802853, 0.010328];
  const d = [1.432788, 0.189269, 0.001308];
  return t - (c[0] + c[1] * t + c[2] * t * t) / (1 + d[0] * t + d[1] * t * t + d[2] * t * t * t);
}

function gamma(z) {
  if (z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * gamma(1 - z));
  z -= 1;
  const g = 7;
  const c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028,
    771.32342877765313, -176.61502916214059, 12.507343278686905,
    -0.13857109526572012, 9.9843695780195716e-6, 1.1948723154820998e-8];
  let x = c[0];
  for (let i = 1; i < g + 2; i++) x += c[i] / (z + i);
  const t = z + g + 0.5;
  return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
}

function logGamma(z) { return Math.log(gamma(z)); }

function incompleteBeta(x, a, b) {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  if (x > (a + 1) / (a + b + 2)) return 1 - incompleteBeta(1 - x, b, a);
  const lnBeta = logGamma(a) + logGamma(b) - logGamma(a + b);
  const front = Math.exp(Math.log(x) * a + Math.log(1 - x) * b - lnBeta);
  const maxIter = 200, eps = 1e-14, tiny = 1e-30;
  let f = 1, c = 1, d = 1 - (a + b) * x / (a + 1);
  if (Math.abs(d) < tiny) d = tiny;
  d = 1 / d; f = d;
  for (let m = 1; m <= maxIter; m++) {
    let num = m * (b - m) * x / ((a + 2 * m - 1) * (a + 2 * m));
    d = 1 + num * d; if (Math.abs(d) < tiny) d = tiny;
    c = 1 + num / c; if (Math.abs(c) < tiny) c = tiny;
    d = 1 / d; f *= c * d;
    num = -(a + m) * (a + b + m) * x / ((a + 2 * m) * (a + 2 * m + 1));
    d = 1 + num * d; if (Math.abs(d) < tiny) d = tiny;
    c = 1 + num / c; if (Math.abs(c) < tiny) c = tiny;
    d = 1 / d;
    const delta = c * d; f *= delta;
    if (Math.abs(delta - 1) < eps) break;
  }
  return front * f / a;
}

function tCDF(x, df) {
  const t = df / (df + x * x);
  const ibeta = incompleteBeta(t, df / 2, 0.5);
  return x >= 0 ? 1 - 0.5 * ibeta : 0.5 * ibeta;
}

function centralTQuantile(p, df) {
  if (p <= 0 || p >= 1 || df <= 0) return NaN;
  let lower = -10, upper = 10;
  while (tCDF(lower, df) > p) lower *= 2;
  while (tCDF(upper, df) < p) upper *= 2;
  for (let i = 0; i < 100; i++) {
    const mid = (lower + upper) / 2;
    if (Math.abs(tCDF(mid, df) - p) < 1e-12) return mid;
    if (tCDF(mid, df) < p) lower = mid; else upper = mid;
  }
  return (lower + upper) / 2;
}

// RSABE计算函数
function calculateScaledLimits(cvwR, agency) {
  const sigmaW = Math.sqrt(Math.log(1 + cvwR * cvwR));
  
  let k, s0;
  if (agency === 'FDA') {
    k = Math.log(1.25) / 0.25; // ≈ 0.893
    s0 = 0.25;
  } else { // EMA
    k = 0.760;
    s0 = 0.294;
  }
  
  // 标度因子
  let scaledSigma = sigmaW;
  
  // 约束：不能超过最大放宽限度
  if (agency === 'FDA') {
    // FDA: 最大放宽到0.6984 (对应CV ≈ 50%)
    scaledSigma = Math.min(sigmaW, 0.6984);
  }
  // EMA: 没有明确上限，但点估计约束仍适用
  
  // 计算标度后的接受标准
  const lowerLimit = Math.exp(-k * scaledSigma);
  const upperLimit = Math.exp(k * scaledSigma);
  
  return {
    sigmaW: sigmaW,
    scaledSigma: scaledSigma,
    lowerLimit: lowerLimit,
    upperLimit: upperLimit,
    k: k
  };
}

function calculatePowerRSABE(alpha, cvwR, cvwT, gmr, n, agency, design, nsim) {
  // 检查点估计约束
  if (gmr < 0.80 || gmr > 1.25) {
    return 0;
  }
  
  // 计算对数尺度标准差
  const sigmaW_R = Math.sqrt(Math.log(1 + cvwR * cvwR));
  const sigmaW_T = Math.sqrt(Math.log(1 + cvwT * cvwT));
  
  // 计算标度参数
  let k, s0, maxScaledSigma;
  if (agency === 'FDA') {
    k = Math.log(1.25) / 0.25;
    s0 = 0.25;
    maxScaledSigma = 0.6984; // 最大放宽到CV≈50%
  } else {
    // EMA: 标度常数0.760, s0=0.294
    k = 0.760;
    s0 = 0.294;
    maxScaledSigma = Infinity; // EMA没有明确上限，但点估计约束仍适用
  }
  
  // 根据设计确定周期数
  let nPeriod;
  switch(design) {
    case '2x2x2': nPeriod = 2; break;
    case '2x3x3': nPeriod = 3; break;
    case '2x2x4': nPeriod = 4; break;
    case 'parallel': nPeriod = 1; break;
    default: nPeriod = 2;
  }
  
  // 自由度
  let df;
  switch(design) {
    case '2x2x2': df = n - 2; break;
    case '2x3x3': df = n - 3; break;
    case '2x2x4': df = n - 3; break;
    case 'parallel': df = n - 2; break;
    default: df = n - 2;
  }
  
  if (df <= 0) return NaN;
  
  const critValue = centralTQuantile(1 - alpha, df);
  const lnGMR = Math.log(gmr);
  
  let passCount = 0;
  
  for (let sim = 0; sim < nsim; sim++) {
    if (design === 'parallel') {
      // 平行设计
      const nPerGroup = Math.floor(n / 2);
      let sumT = 0, sumR = 0;
      let sumT2 = 0, sumR2 = 0;
      
      for (let i = 0; i < nPerGroup; i++) {
        const tVal = lnGMR + sigmaW_T * randomNormal();
        sumT += tVal;
        sumT2 += tVal * tVal;
      }
      for (let i = 0; i < nPerGroup; i++) {
        const rVal = sigmaW_R * randomNormal();
        sumR += rVal;
        sumR2 += rVal * rVal;
      }
      
      const meanT = sumT / nPerGroup;
      const meanR = sumR / nPerGroup;
      const diff = meanT - meanR;
      
      const varT = (sumT2 - nPerGroup * meanT * meanT) / (nPerGroup - 1);
      const varR = (sumR2 - nPerGroup * meanR * meanR) / (nPerGroup - 1);
      const pooledVar = (varT + varR) / 2;
      const se = Math.sqrt(pooledVar * 2 / nPerGroup);
      
      const sR = Math.sqrt(varR);
      
      let theta1, theta2;
      if (sR <= s0) {
        theta1 = Math.log(0.8);
        theta2 = Math.log(1.25);
      } else {
        const scaledS = Math.min(sR, maxScaledSigma);
        theta1 = -k * scaledS;
        theta2 = k * scaledS;
      }
      
      const t1 = (diff - theta1) / se;
      const t2 = (theta2 - diff) / se;
      
      if (t1 > critValue && t2 > critValue && diff >= Math.log(0.8) && diff <= Math.log(1.25)) {
        passCount++;
      }
    } else {
      // 交叉设计
      const nPerSeq = Math.floor(n / 2);
      
      // 收集所有受试者的T-R差值和R值
      let allDiffs = [];
      let allRValues = [];
      
      // 序列1: TRTR... (T在偶数周期)
      for (let i = 0; i < nPerSeq; i++) {
        const subjectEffect = randomNormal() * 1.0;
        let tSum = 0, rSum = 0;
        let nT = 0, nR = 0;
        
        for (let p = 0; p < nPeriod; p++) {
          if (p % 2 === 0) {
            // T period
            const tVal = lnGMR + subjectEffect + sigmaW_T * randomNormal();
            tSum += tVal;
            nT++;
          } else {
            // R period
            const rVal = subjectEffect + sigmaW_R * randomNormal();
            rSum += rVal;
            nR++;
          }
        }
        
        const meanT = tSum / nT;
        const meanR = rSum / nR;
        allDiffs.push(meanT - meanR);
        allRValues.push(meanR);
      }
      
      // 序列2: RTRT... (R在偶数周期)
      for (let i = 0; i < nPerSeq; i++) {
        const subjectEffect = randomNormal() * 1.0;
        let tSum = 0, rSum = 0;
        let nT = 0, nR = 0;
        
        for (let p = 0; p < nPeriod; p++) {
          if (p % 2 === 0) {
            // R period
            const rVal = subjectEffect + sigmaW_R * randomNormal();
            rSum += rVal;
            nR++;
          } else {
            // T period
            const tVal = lnGMR + subjectEffect + sigmaW_T * randomNormal();
            tSum += tVal;
            nT++;
          }
        }
        
        const meanT = tSum / nT;
        const meanR = rSum / nR;
        allDiffs.push(meanT - meanR);
        allRValues.push(meanR);
      }
      
      // 计算均值和标准误
      let sumDiff = 0;
      for (let d of allDiffs) sumDiff += d;
      const meanDiff = sumDiff / allDiffs.length;
      
      let sumSq = 0;
      for (let d of allDiffs) sumSq += (d - meanDiff) * (d - meanDiff);
      const varDiff = sumSq / (allDiffs.length - 1);
      const se = Math.sqrt(varDiff / allDiffs.length);
      
      // 估计参比标准差（使用所有R值的变异）
      let sumR = 0;
      for (let r of allRValues) sumR += r;
      const meanR = sumR / allRValues.length;
      let sumRSq = 0;
      for (let r of allRValues) sumRSq += (r - meanR) * (r - meanR);
      const sR = Math.sqrt(sumRSq / (allRValues.length - 1));
      
      // 标度后的接受标准
      let theta1, theta2;
      if (sR <= s0) {
        theta1 = Math.log(0.8);
        theta2 = Math.log(1.25);
      } else {
        const scaledS = Math.min(sR, maxScaledSigma);
        theta1 = -k * scaledS;
        theta2 = k * scaledS;
      }
      
      // TOST检验
      const t1 = (meanDiff - theta1) / se;
      const t2 = (theta2 - meanDiff) / se;
      
      if (t1 > critValue && t2 > critValue && meanDiff >= Math.log(0.8) && meanDiff <= Math.log(1.25)) {
        passCount++;
      }
    }
  }
  
  return passCount / nsim;
}

function randomNormal() {
  // Box-Muller变换生成标准正态随机数
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

function findSampleSizeRSABE(alpha, targetPower, cvwR, cvwT, gmr, agency, design, nsim) {
  let n = 2;
  const maxN = 500;
  
  while (n <= maxN) {
    const power = calculatePowerRSABE(alpha, cvwR, cvwT, gmr, n, agency, design, nsim);
    if (power >= targetPower) {
      return n;
    }
    n += 2;
  }
  
  return n;
}

const defaults = {
  type: 'power',
  design: '2x3x3',
  agency: 'FDA',
  nsim: 5000,
  cvwR: 0.4,
  cvwT: 0.4,
  gmr: 0.9,
  alpha: 0.05,
  value: 24
};

function resetDefaults() {
  document.getElementById('type').value = defaults.type;
  document.getElementById('design').value = defaults.design;
  document.getElementById('agency').value = defaults.agency;
  document.getElementById('nsim').value = defaults.nsim;
  document.getElementById('cvwR').value = defaults.cvwR;
  document.getElementById('cvwT').value = defaults.cvwT;
  document.getElementById('gmr').value = defaults.gmr;
  document.getElementById('alpha').value = defaults.alpha;
  document.getElementById('value').value = defaults.value;
  updateValueLabel();
  calculate();
}

function updateValueLabel() {
  const type = document.getElementById('type').value;
  const label = document.getElementById('valueLabel');
  const input = document.getElementById('value');
  
  if (type === 'power') {
    label.innerHTML = '样本量 <span class="hint">(Sample Size)</span>';
    input.value = 24;
  } else {
    label.innerHTML = '目标功效 <span class="hint">(Target Power)</span>';
    input.value = 0.9;
  }
}

function calculate() {
  const type = document.getElementById('type').value;
  const design = document.getElementById('design').value;
  const agency = document.getElementById('agency').value;
  const nsim = parseInt(document.getElementById('nsim').value);
  const cvwR = parseFloat(document.getElementById('cvwR').value);
  const cvwT = parseFloat(document.getElementById('cvwT').value);
  const gmr = parseFloat(document.getElementById('gmr').value);
  const alpha = parseFloat(document.getElementById('alpha').value);
  const value = parseFloat(document.getElementById('value').value);

  if ([cvwR, cvwT, gmr, alpha, value].some(v => isNaN(v))) {
    alert('请输入有效的数值参数');
    return;
  }

  if (alpha <= 0 || alpha >= 1) {
    alert('α必须在0和1之间');
    return;
  }

  if (cvwR <= 0 || cvwT <= 0) {
    alert('变异系数必须为正数');
    return;
  }

  if (gmr <= 0) {
    alert('几何均值比必须为正数');
    return;
  }

  // 计算标度后的接受标准
  const scaledLimits = calculateScaledLimits(cvwR, agency);

  let power, sampleSize;

  if (type === 'power') {
    const n = Math.round(value);
    if (n < 2) {
      alert('样本量必须至少为2');
      return;
    }
    power = calculatePowerRSABE(alpha, cvwR, cvwT, gmr, n, agency, design, nsim);
    sampleSize = n;
  } else {
    const targetPower = value;
    if (targetPower <= 0 || targetPower >= 1) {
      alert('目标功效必须在0和1之间');
      return;
    }
    sampleSize = findSampleSizeRSABE(alpha, targetPower, cvwR, cvwT, gmr, agency, design, nsim);
    power = calculatePowerRSABE(alpha, cvwR, cvwT, gmr, sampleSize, agency, design, nsim);
  }

  // 显示结果
  document.getElementById('scaledLimits_result').textContent = 
    `[${scaledLimits.lowerLimit.toFixed(4)}, ${scaledLimits.upperLimit.toFixed(4)}]`;
  document.getElementById('scaledLimits_sub').textContent = 
    `标度因子: ${scaledLimits.k.toFixed(3)}`;
  
  document.getElementById('power_result').textContent = (power * 100).toFixed(2) + '%';
  document.getElementById('sampleSize_result').textContent = sampleSize;
  document.getElementById('sigmaW_result').textContent = scaledLimits.sigmaW.toFixed(4);

  const designNames = {
    '2x2x2': '2x2x2交叉设计',
    '2x3x3': '2x3x3交叉设计',
    '2x2x4': '2x2x4交叉设计',
    'parallel': '平行设计'
  };

  const agencyNames = {
    'FDA': 'FDA (美国)',
    'EMA': 'EMA (欧洲)'
  };

  const summaryText = `本研究采用${designNames[design]}，使用${agencyNames[agency]}的RSABE方法评估高变异药物的生物等效性。参比制剂变异系数为${(cvwR * 100).toFixed(1)}%，受试制剂变异系数为${(cvwT * 100).toFixed(1)}%。预期几何均值比为${gmr}，单侧α为${alpha}。根据参比制剂的变异程度，标度后的接受标准为[${scaledLimits.lowerLimit.toFixed(4)}, ${scaledLimits.upperLimit.toFixed(4)}]（原始标准为[0.8000, 1.2500]）。基于${nsim}次Monte Carlo模拟计算功效。`;
  
  if (type === 'power') {
    document.getElementById('summary').textContent = summaryText + `当样本量为${sampleSize}时，统计功效为${(power * 100).toFixed(2)}%。`;
  } else {
    document.getElementById('summary').textContent = summaryText + `为达到${(value * 100).toFixed(0)}%的目标功效，需要至少${sampleSize}例样本量，实际功效为${(power * 100).toFixed(2)}%。`;
  }
}

document.getElementById('type').addEventListener('change', updateValueLabel);

updateValueLabel();
calculate();
</script>
</body>
</html>
