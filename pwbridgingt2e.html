<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>桥接研究样本量评估</title>
<style>
  :root {
    --color-primary: #206ea7;
    --color-primary-light: rgba(32,110,167,0.15);
    --color-book: #077b70;
    --color-chapter: #af4d0d;
    --color-page: #206ea7;
    --color-draft: #7e50b1;
    --color-bookshelf: #a94747;
    --color-positive: #0f7d15;
    --color-negative: #ab0f0e;
    --color-warning: #cf4d03;
    --color-info: #0288D1;
    --bg-body: #f5f5f5;
    --bg-card: #ffffff;
    --text-primary: #444;
    --text-muted: #777;
    --text-heading: #222;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Oxygen, Ubuntu, Roboto, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
    --radius-s: 3px;
    --radius-m: 4px;
    --radius-l: 8px;
    --shadow-card: 0 1px 6px -1px rgba(0,0,0,0.1);
    --shadow-sub: 0 1px 3px 0 rgba(0,0,0,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg-body);
    color: var(--text-primary);
    line-height: 1.6;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    padding: 20px;
  }
  .container {
    max-width: 1300px;
    margin: 0 auto;
    background: var(--bg-card);
    padding: 30px;
    border-radius: var(--radius-l);
    box-shadow: var(--shadow-card);
  }
  h1 {
    color: var(--text-heading);
    font-size: 1.8rem;
    font-weight: 600;
    margin-bottom: 8px;
  }
  h2 {
    color: var(--text-heading);
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h2::before {
    content: "";
    display: inline-block;
    width: 4px;
    height: 18px;
    background: var(--color-primary);
    border-radius: 2px;
  }
  .section {
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
  }
  .field {
    display: flex;
    flex-direction: column;
  }
  .field label {
    font-size: 0.85rem;
    color: var(--text-primary);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .field .hint {
    color: var(--text-muted);
    font-weight: 400;
    font-size: 0.8rem;
  }
  .field input {
    width: 100%;
    padding: 7px 12px;
    border: 1px solid #ddd;
    border-radius: var(--radius-m);
    font-size: 0.9rem;
    font-family: var(--font-body);
    color: var(--text-primary);
    background: #fff;
    transition: border-color ease-in-out 120ms, box-shadow ease-in-out 120ms;
  }
  .field input:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 2px var(--color-primary-light);
  }
  .buttons {
    display: flex;
    gap: 10px;
    margin: 20px 0;
  }
  button {
    text-decoration: none;
    font-size: 0.85rem;
    line-height: 1.4em;
    padding: 7.8px 16px;
    margin: 6px 0;
    display: inline-block;
    font-weight: 400;
    outline: 0;
    border-radius: var(--radius-m);
    cursor: pointer;
    transition: background-color ease-in-out 120ms, filter ease-in-out 120ms, box-shadow ease-in-out 120ms;
    border: 1px solid transparent;
    vertical-align: top;
    font-family: var(--font-body);
  }
  button:hover {
    filter: brightness(1.1);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    filter: none;
  }
  .btn-primary {
    background: var(--color-primary);
    color: #fff;
    border-color: var(--color-primary);
  }
  .btn-secondary {
    background: #edf2f7;
    color: var(--text-primary);
    border-color: #ddd;
  }
  .btn-secondary:hover {
    background: #e2e8f0;
  }
  .results {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .result-card {
    background: var(--bg-card);
    border: 1px solid #e0e0e0;
    border-left: 4px solid var(--color-primary);
    border-radius: var(--radius-s);
    padding: 16px 18px;
    box-shadow: var(--shadow-sub);
  }
  .result-card .label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .result-card .value {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--color-primary);
    font-variant-numeric: tabular-nums;
  }
  .result-card .sub {
    font-size: 0.8em;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .summary {
    grid-column: 1 / -1;
  }
  .summary-text {
    color: var(--text-primary);
    line-height: 1.9;
    font-size: 0.95em;
    margin-top: 4px;
  }
  .collapsible-section {
    margin-top: 20px;
    border: 1px solid #e0e0e0;
    border-radius: var(--radius-s);
    overflow: hidden;
    box-shadow: var(--shadow-sub);
  }
  .collapse-toggle {
    width: 100%;
    padding: 16px 20px;
    background: var(--bg-card);
    border: none;
    border-left: 4px solid var(--color-book);
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    font-size: 1em;
    font-weight: 600;
    color: var(--text-heading);
    transition: background-color ease-in-out 120ms;
  }
  .collapse-toggle:hover {
    background: #f8f9fa;
  }
  .collapse-icon {
    transition: transform 0.3s;
    font-size: 0.8em;
  }
  .collapse-icon.rotated {
    transform: rotate(180deg);
  }
  .collapse-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease-out, padding 0.3s ease-out;
    padding: 0 20px;
    background: var(--bg-card);
  }
  .collapse-content.expanded {
    max-height: 800px;
    padding: 20px;
    transition: max-height 0.5s ease-in, padding 0.3s ease-in;
  }
  @media (max-width: 520px) {
    .results { grid-template-columns: 1fr; }
    .container { padding: 20px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>桥接研究样本量评估</h1>

  <div class="section">
    <h2>研究假设</h2>
    <div class="grid">
      <div class="field">
        <label>全局HR <span class="hint">(Global Estimated HR)</span></label>
        <input type="number" id="G" value="0.73" step="0.01">
      </div>
      <div class="field">
        <label>局部HR <span class="hint">(Local Assumed HR)</span></label>
        <input type="number" id="L" value="0.73" step="0.01">
      </div>
      <div class="field">
        <label>桥接条件 <span class="hint">（保留全局疗效的比例）</span></label>
        <input type="number" id="pi" value="0.5" step="0.01">
      </div>
      <div class="field">
        <label>随机化比例 <span class="hint">(T/R Ratio)</span></label>
        <input type="number" id="R" value="1" step="0.1">
      </div>
      <div class="field">
        <label>事件数 <span class="hint">(Event)</span></label>
        <input type="number" id="E" value="100" step="1">
      </div>
      <div class="field">
        <label>事件转化率 <span class="hint">（样本量转化为事件数的比例）</span></label>
        <input type="number" id="Tr" value="0.7" step="0.01">
      </div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn-primary" onclick="calculate()">计算</button>
    <button class="btn-secondary" onclick="resetDefaults()">重置默认值</button>
  </div>

  <div class="results">
    <div class="result-card">
      <div class="label">桥接界值</div>
      <div class="value" id="margin_result">—</div>
    </div>
    <div class="result-card">
      <div class="label">事件数</div>
      <div class="value" id="E_result">—</div>
    </div>
    <div class="result-card">
      <div class="label">成功率（统计能效）</div>
      <div class="value" id="PW_result">—</div>
    </div>
    <div class="result-card">
      <div class="label">样本量</div>
      <div class="value" id="SS_result">—</div>
    </div>
    <div class="result-card summary">
      <div class="label">建议方案章节</div>
      <div class="summary-text" id="summary">—</div>
    </div>
  </div>

  <div class="collapsible-section">
    <button class="collapse-toggle" onclick="toggleCollapse()">
      <span>中期分析补充计算</span>
      <span class="collapse-icon" id="collapseIcon">▼</span>
    </button>
    <div class="collapse-content" id="collapseContent">
      <div class="section">
        <h2>已观测数据</h2>
        <div class="grid">
          <div class="field">
            <label>已观测事件数 <span class="hint">(E0)</span></label>
            <input type="number" id="E0" value="26" step="1">
          </div>
          <div class="field">
            <label>已入组样本量 <span class="hint">(N0)</span></label>
            <input type="number" id="N0" value="60" step="1">
          </div>
        </div>
      </div>
      <div class="results">
        <div class="result-card">
          <div class="label">待观测事件数</div>
          <div class="value" id="E_remaining">—</div>
        </div>
        <div class="result-card">
          <div class="label">待入组样本量</div>
          <div class="value" id="SS_remaining">—</div>
        </div>
        <div class="result-card summary">
          <div class="label">合计样本量</div>
          <div class="value" id="SS_total">—</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
function pnorm(x, mean, sd) {
  const z = (x - mean) / sd;
  return 0.5 * (1 + erf(z / Math.SQRT2));
}

function erf(x) {
  const sign = Math.sign(x);
  x = Math.abs(x);
  const a1 =  0.254829592;
  const a2 = -0.284496736;
  const a3 =  1.421413741;
  const a4 = -1.453152027;
  const a5 =  1.061405429;
  const p  =  0.3275911;
  const t = 1.0 / (1.0 + p * x);
  const y = 1.0 - (((((a5*t + a4)*t) + a3)*t + a2)*t + a1)*t * Math.exp(-x*x);
  return sign * y;
}

const defaults = { G:0.73, L:0.73, pi:0.5, R:1, E:100, Tr:0.7 };

function resetDefaults() {
  Object.keys(defaults).forEach(k => document.getElementById(k).value = defaults[k]);
  calculate();
}

function calculate() {
  const G  = parseFloat(document.getElementById('G').value);
  const L  = parseFloat(document.getElementById('L').value);
  const pi = parseFloat(document.getElementById('pi').value);
  const R  = parseFloat(document.getElementById('R').value);
  const E  = parseFloat(document.getElementById('E').value);
  const Tr = parseFloat(document.getElementById('Tr').value);

  if ([G,L,pi,R,E,Tr].some(v => isNaN(v) || v <= 0)) {
    alert('请输入有效的正数参数');
    return;
  }

  const m  = Math.log(L);
  const a1 = 1 / (R + 1);
  const a2 = 1 - a1;
  const s  = Math.sqrt(1 / (a1 * a2 * E));
  const c  = Math.log(1 - pi * (1 - G));
  const P  = pnorm(c, m, s);

  const N = E / Tr;
  const SS = Math.ceil(N / (R + 1)) * (R + 1);

  const margin = 1 - (1 - G) * pi;

  document.getElementById('margin_result').textContent = margin.toFixed(4);
  document.getElementById('E_result').textContent = E;
  document.getElementById('PW_result').textContent = (P * 100).toFixed(2) + '%';
  document.getElementById('SS_result').textContent = SS;

  const summaryText = `已知全局人群的疗效为${G}，本研究假设局部人群为${L}。桥接标准为局部人群保留全局人群${pi}的疗效，界值为${margin.toFixed(4)}。试验组与对照组随机化比例为${R}:1。当观测到${E}例事件数时，桥接成功率（统计能效）为${(P * 100).toFixed(2)}%。假设死亡事件转化率为${Tr}，则至少需要${SS}例样本量。`;
  document.getElementById('summary').textContent = summaryText;

  const E0 = parseFloat(document.getElementById('E0').value);
  const N0 = parseFloat(document.getElementById('N0').value);
  if (!isNaN(E0) && !isNaN(N0) && E0 >= 0 && N0 >= 0) {
    const E_rem = E - E0;
    const SS_rem_raw = E_rem / Tr;
    const SS_rem = Math.ceil(SS_rem_raw / (R + 1)) * (R + 1);
    const SS_tot = SS_rem + N0;
    document.getElementById('E_remaining').textContent = E_rem;
    document.getElementById('SS_remaining').textContent = SS_rem;
    document.getElementById('SS_total').textContent = SS_tot;
  }
}

function toggleCollapse() {
  const content = document.getElementById('collapseContent');
  const icon = document.getElementById('collapseIcon');
  content.classList.toggle('expanded');
  icon.classList.toggle('rotated');
}

calculate();
</script>
</body>
</html>
